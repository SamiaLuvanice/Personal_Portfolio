# Hooks locais (https://pre-commit.com):
#   pip install pre-commit && pre-commit install --hook-type pre-commit --hook-type commit-msg
# Lint, tipos, testes e build ficam nos portões (node .agents/scripts/gates.mjs) e no CI.
default_install_hook_types: [pre-commit, commit-msg]
# Sem isto, os hooks de arquivo rodariam de novo no estágio commit-msg.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: commit-msg-policy
        name: Conventional Commits, autoria humana e branch protegida
        entry: node .agents/scripts/commit-msg.mjs
        language: system
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(\.agents/skills/(impeccable|shadcn|seo-audit|frontend-design|tdd)/|src/components/ui/)
      - id: end-of-file-fixer
        exclude: ^(\.agents/skills/(impeccable|shadcn|seo-audit|frontend-design|tdd)/|src/components/ui/|public/.*\.(svg|pdf))
      - id: check-yaml
      - id: check-json
        # tsconfig aceita comentários JSONC.
        exclude: ^tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: detect-private-key
