name: CI
# Deploy é feito pela integração Git da Vercel (preview por PR, produção em main).
# Este workflow valida; o check agregador "CI" deve ser obrigatório na proteção de main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint, tipos, testes e build (harness.yaml)
        run: node .agents/scripts/gates.mjs --skip-install --only lint,typecheck,test,build

  e2e:
    name: E2E + acessibilidade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node .agents/scripts/gates.mjs --skip-install --only e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Orçamento de acessibilidade, SEO, boas práticas e desempenho
        run: npx lhci autorun
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

  harness:
    name: Harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Testes do núcleo do harness
        run: node --test ".agents/scripts/*.test.mjs"
      - name: Projeções em dia
        run: node .agents/scripts/sync.mjs --check
      - name: Diagnóstico
        run: node .agents/scripts/diagnose.mjs
      - name: Validar workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  commits:
    name: Commit policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Conventional Commits e autoria humana no range do PR
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .agents/scripts/commit-msg.mjs --range "origin/$BASE_REF..$HEAD_SHA"

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks nos commits do evento
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Varre só os commits novos; o histórico anterior não é reavaliado a cada evento.
          if [ "$EVENT_NAME" = pull_request ]; then
            range="origin/$BASE_REF..$HEAD_SHA"
          elif [ "$EVENT_NAME" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$BEFORE..$AFTER"
          else
            range="-1"
          fi
          echo "Range: $range"
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --log-opts="$range"

  ci:
    name: CI
    if: always()
    needs: [quality, e2e, lighthouse, harness, commits, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir todos os gates
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          COMMITS_RESULT: ${{ needs.commits.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Resultados: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = success ]; then continue; fi
            # Commit policy só roda em PR; em push o job fica "skipped".
            if [ "$result" = skipped ] && [ "$EVENT_NAME" != pull_request ] && [ "$COMMITS_RESULT" = skipped ]; then continue; fi
            echo "Gate falhou: $result"
            exit 1
          done
